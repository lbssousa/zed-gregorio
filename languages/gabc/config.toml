name = "GABC"
grammar = "gregorio"
path_suffixes = ["gabc"]
line_comments = ["% "]
tab_size = 2

# Use gregorio-lsp's built-in formatter (powered by grefmt) for Format Document
# and format-on-save. Options (maxLineWidth, breakAfterClef, breakAfterBar,
# wordPerLine) are configurable via the "formatting" key of
# lsp.gregorio-lsp.settings in Zed's settings.json.
formatter = { language_server = { name = "gregorio-lsp" } }

brackets = [
  { start = "(", end = ")", close = true, newline = false, not_in = ["string"] },
  { start = "[", end = "]", close = true, newline = false, not_in = ["string"] },
  { start = "{", end = "}", close = true, newline = true, not_in = ["string"] },
  { start = "<", end = ">", close = true, newline = false, not_in = ["string"] },
]
